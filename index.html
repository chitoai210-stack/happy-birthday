<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <div class="aura-cup"></div>
                <img src="cup.png.png" id="world-cup" alt="Cup CKTG">
                <p class="click-hint">Oke lấy luôn</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <img src="gwen.png" id="gwen-char" alt="Gwen">
        </div>

    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
