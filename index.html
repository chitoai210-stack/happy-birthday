<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwen Birthday - Challenger Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="sfx-beep" src="beep.mp3"></audio>
    <audio id="bgm-cute" src="cute.mp3" loop></audio>
    <audio id="sfx-click" src="click.mp3"></audio>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="cyan-power-aura" x="-50%" y="-50%" width="200%" height="200%">
                <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" result="distorted" />
                
                <feMorphology operator="dilate" radius="4" in="distorted" result="dilated" />
                <feGaussianBlur in="dilated" stdDeviation="6" result="blurred" />
                <feFlood flood-color="#00ffea" result="cyanColor" /> <feComposite in="cyanColor" in2="blurred" operator="in" result="coloredGlow" />
                
                <feMerge>
                    <feMergeNode in="coloredGlow" />
                    <feMergeNode in="coloredGlow" /> <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="countdown-screen" class="screen">
        <div id="timer">5</div>
    </div>

    <div id="intro-screen" class="screen hidden">
        <img src="nen.jpg" alt="Galaxy Background" class="bg-layer">
        
        <div class="intro-content">
            <div class="item-container left-side">
                <div id="cup-wrapper" class="aura-target">
                    <img src="cup.png.png" alt="Cup CKTG" id="cup-img">
                    <div class="click-hint">ĐỒNG Ý !</div>
                </div>
            </div>

            <div class="item-container right-side">
                <div id="gwen-wrapper" class="aura-target">
                    <div class="dialogue-box">
                        <p>Happy Birthday!</p>
                    </div>
                    <img src="gwen.png" alt="Gwen" id="gwen-img">
                </div>
            </div>
        </div>
    </div>

    <div id="flash-overlay" class="hidden">
        <div id="troll-text">
            Muốn lấy à, đâu có dễ vậy ku <span style="font-size: 1.5em;">😒</span>
        </div>
    </div>

    <div id="video-screen" class="screen hidden">
        <video id="main-video" playsinline>
            <source src="gojo.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
        </video>
    </div>

    <script src="script.js"></script>
</body>
</html>
