<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chức mừng sinh nhật</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="gift-box" class="gift-box" onclick="openGift()">
            🎁
            <p class="guide-text">Chạm để mở quà nhé!</p>
        </div>

        <div id="content" class="content hidden">
            <h1 class="title">Happy Birthday!</h1>
            <div class="media-placeholder">
                <img src="https://via.placeholder.com/300" alt="Birthday Image" id="birthday-img">
            </div>
            <p class="message" id="message-text">
                Chúc bạn tuổi mới rực rỡ!
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
