<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="aurora-filter" x="-100%" y="-100%" width="300%" height="300%">
                <feMorphology operator="dilate" radius="20" in="SourceAlpha" result="auroraBase"/>
                <feGaussianBlur stdDeviation="15" in="auroraBase" result="auroraBlurred"/>
                
                <feTurbulence type="fractalNoise" baseFrequency="0.001 0.04" numOctaves="2" result="auroraNoise">
                    <animate attributeName="baseFrequency" values="0.001 0.04; 0.001 0.06; 0.001 0.04" dur="10s" repeatCount="indefinite"/>
                </feTurbulence>
                
                <feDisplacementMap in="auroraBlurred" in2="auroraNoise" scale="50" xChannelSelector="R" yChannelSelector="G" result="auroraDistorted"/>
                
                <feFlood flood-color="#8a2be2" flood-opacity="0.7" result="purpleColor"/>
                <feComposite in="purpleColor" in2="auroraDistorted" operator="in" result="finalPurpleAurora"/>

                <feMorphology operator="dilate" radius="5" in="SourceAlpha" result="silverBase"/>
                <feGaussianBlur stdDeviation="3" in="silverBase" result="silverBlurred"/>
                <feFlood flood-color="#ffffff" flood-opacity="0.95" result="silverColor"/>
                <feComposite in="silverColor" in2="silverBlurred" operator="in" result="finalSilverGlow"/>

                <feMerge>
                    <feMergeNode in="finalPurpleAurora"/> <feMergeNode in="finalSilverGlow"/>   <feMergeNode in="SourceGraphic"/>     </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="aurora-effect" alt="Cup CKTG">
                <p class="click-hint">ĐỒNG Ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="aurora-effect" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
