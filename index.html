<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="intro-screen">
        <img src="gwen.png" id="gwen-char" alt="Gwen">
        
        <div id="cup-wrapper" onclick="openGift()">
            <div class="aura"></div>
            <img src="cup.png.png" id="world-cup" alt="Cup CKTG">
        </div>
        
        <p class="guide-text">Click vào Cúp để nhận quà</p>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
