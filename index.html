<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="blue-fire-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feMorphology operator="dilate" radius="6" in="SourceAlpha" result="expanded"/>
                
                <feGaussianBlur stdDeviation="5" in="expanded" result="blurred"/>
                
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="3" result="noise">
                    <animate attributeName="baseFrequency" values="0.01 0.05; 0.01 0.09; 0.01 0.05" dur="3s" repeatCount="indefinite"/>
                </feTurbulence>
                
                <feDisplacementMap in="blurred" in2="noise" scale="25" result="distortedEdge"/>
                
                <feFlood flood-color="#00ffff" result="colorCyan"/>
                <feComposite in="colorCyan" in2="distortedEdge" operator="in" result="fireCyan"/>
                
                <feFlood flood-color="#0000ff" result="colorBlue"/>
                <feComposite in="colorBlue" in2="distortedEdge" operator="in" result="fireBlue"/>

                <feMerge>
                    <feMergeNode in="fireBlue"/>
                    <feMergeNode in="fireCyan"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="god-mode-aura" alt="Cup CKTG">
                <p class="click-hint">Đồng ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="god-mode-aura" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
