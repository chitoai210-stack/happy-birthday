<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="ultra-instinct-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="whiteBorder"/>
                <feGaussianBlur stdDeviation="2" in="whiteBorder" result="blurredWhite"/>
                <feFlood flood-color="#ffffff" flood-opacity="1" result="whiteColor"/>
                <feComposite in="whiteColor" in2="blurredWhite" operator="in" result="whiteGlow"/>

                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="purpleNoise">
                    <animate attributeName="baseFrequency" values="0.015;0.02;0.015" dur="4s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceAlpha" in2="purpleNoise" scale="30" result="displacedAlpha"/>
                <feGaussianBlur stdDeviation="15" in="displacedAlpha" result="blurredPurple"/>
                <feFlood flood-color="#8a2be2" flood-opacity="0.8" result="purpleColor"/>
                <feComposite in="purpleColor" in2="blurredPurple" operator="in" result="purpleAura"/>

                <feMerge>
                    <feMergeNode in="purpleAura"/> <feMergeNode in="whiteGlow"/>  <feMergeNode in="SourceGraphic"/> </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="ultra-instinct-aura" alt="Cup CKTG">
                <p class="click-hint">Đồng ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="ultra-instinct-aura" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
