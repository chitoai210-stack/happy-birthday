<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="sjw-shadow-filter" x="-100%" y="-100%" width="300%" height="300%">
                <feTurbulence type="fractalNoise" baseFrequency="0.02 0.08" numOctaves="4" result="smokeNoise">
                    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -100" dur="8s" repeatCount="indefinite"/>
                </feTurbulence>

                <feMorphology operator="dilate" radius="15" in="SourceAlpha" result="expandedAlpha"/>
                
                <feDisplacementMap in="expandedAlpha" in2="smokeNoise" scale="40" xChannelSelector="R" yChannelSelector="G" result="distortedShadow"/>
                
                <feGaussianBlur stdDeviation="10" in="distortedShadow" result="blurredShadow"/>

                <feFlood flood-color="#1a0033" flood-opacity="0.95" result="shadowColor"/>
                <feComposite in="shadowColor" in2="blurredShadow" operator="in" result="finalShadowBase"/>

                <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#4d4dff" flood-opacity="1" in="finalShadowBase" result="electricEdge"/>

                <feMerge>
                    <feMergeNode in="electricEdge"/>   <feMergeNode in="finalShadowBase"/> <feMergeNode in="SourceGraphic"/>   </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="sjw-aura-effect" alt="Cup CKTG">
                <p class="click-hint">ĐỒNG Ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="sjw-aura-effect" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
