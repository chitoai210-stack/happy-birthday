<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="ultra-instinct-wide-aura" x="-100%" y="-100%" width="300%" height="300%">
                <feMorphology operator="dilate" radius="25" in="SourceAlpha" result="purpleBase"/>
                <feGaussianBlur stdDeviation="15" in="purpleBase" result="purpleBlurred"/>
                <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="4" result="purpleNoise">
                     <animate attributeName="baseFrequency" values="0.008;0.012;0.008" dur="6s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="purpleBlurred" in2="purpleNoise" scale="30" xChannelSelector="R" yChannelSelector="G" result="purpleDistorted"/>
                <feFlood flood-color="#8a2be2" flood-opacity="0.6" result="purpleColor"/>
                <feComposite in="purpleColor" in2="purpleDistorted" operator="in" result="finalPurpleAura"/>

                <feMorphology operator="dilate" radius="6" in="SourceAlpha" result="silverBase"/>
                <feGaussianBlur stdDeviation="4" in="silverBase" result="silverBlurred"/>
                <feFlood flood-color="#ffffff" flood-opacity="0.9" result="silverColor"/>
                <feComposite in="silverColor" in2="silverBlurred" operator="in" result="finalSilverAura"/>

                <feMerge>
                    <feMergeNode in="finalPurpleAura"/> <feMergeNode in="finalSilverAura"/> <feMergeNode in="SourceGraphic"/>   </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="mui-aura-effect" alt="Cup CKTG">
                <p class="click-hint">ĐỒNG Ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="mui-aura-effect" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
