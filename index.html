<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenger Birthday Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="ssb-aura-filter" x="-50%" y="-50%" width="200%" height="200%">
                <feMorphology operator="dilate" radius="8" in="SourceAlpha" result="fireBase"/>
                
                <feTurbulence type="fractalNoise" baseFrequency="0.02 0.08" numOctaves="5" seed="1" result="fireNoise">
                    <animate attributeName="seed" values="1;50;100;50;1" dur="0.3s" repeatCount="indefinite"/>
                </feTurbulence>
                
                <feDisplacementMap in="fireBase" in2="fireNoise" scale="20" xChannelSelector="R" yChannelSelector="G" result="distortedFire"/>
                
                <feFlood flood-color="#00bfff" flood-opacity="0.9" result="fireColor"/>
                <feComposite in="fireColor" in2="distortedFire" operator="in" result="finalElectricFire"/>

                <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="coreBase"/>
                <feGaussianBlur stdDeviation="2" in="coreBase" result="coreBlurred"/>
                <feFlood flood-color="#e0ffff" flood-opacity="1" result="coreColor"/>
                <feComposite in="coreColor" in2="coreBlurred" operator="in" result="finalInnerCore"/>

                <feMerge>
                    <feMergeNode in="finalElectricFire"/> <feMergeNode in="finalInnerCore"/>    <feMergeNode in="SourceGraphic"/>     </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="intro-screen">
        
        <div class="side-left">
            <div class="cup-container" onclick="openGift()">
                <img src="cup.png.png" id="world-cup" class="ssb-aura-effect" alt="Cup CKTG">
                <p class="click-hint">ĐỒNG Ý !</p>
            </div>
        </div>

        <div class="side-right">
            <div class="dialogue-box">
                "Đến và lấy chiếc cúp của bạn đi,<br> 
                bạn <span class="highlight">Sandwich GM</span> dễ thương!"
            </div>
            
            <div class="gwen-container">
                <img src="gwen.png" id="gwen-char" class="ssb-aura-effect" alt="Gwen">
            </div>
        </div>
    </div>

    <div id="content-screen">
        <div class="card">
            <h1 class="rank-title">CHÚC MỪNG SINH NHẬT</h1>
            <div class="img-container">
                <img src="thumb-1920-1140434.jpg" alt="My Photo">
            </div>
            <p class="message">
                Chúc mừng "người chơi hệ Thách Đấu"! <br>
                Tuổi mới gank đâu thắng đó, <br>
                Mọi dự định đều "Cắt và Xén" thành công!
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
