<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special Gift for Gwen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <audio id="sound-cute" src="nhackp1.mp3" loop preload="auto"></audio>
    <audio id="sound-explosion" src="tiengno.mp3" preload="auto"></audio>

    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="white-power-aura" x="-50%" y="-50%" width="200%" height="200%">
                <feMorphology operator="dilate" radius="4" in="SourceAlpha" result="thicken"/>
                <feGaussianBlur stdDeviation="6" in="thicken" result="blurred"/>
                <feFlood flood-color="#00e5ff" flood-opacity="0.9" result="glowColor"/>
                <feComposite in="glowColor" in2="blurred" operator="in" result="softGlow"/>
                <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise">
                    <animate attributeName="baseFrequency" values="0.03;0.04;0.03" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="seed" values="1;20;1" dur="10s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="softGlow" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" result="fireGlow"/>
                <feMerge>
                    <feMergeNode in="fireGlow"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
    </svg>

    <div id="login-screen">
        <div class="login-box">
            <h2>SECURITY CHECK</h2>
            <p>Vui lòng nhập mã xác thực để truy cập:</p>
            <input type="password" id="pass-input" placeholder="ACCESS CODE" maxlength="10">
            <button onclick="checkPass()">UNLOCK</button>
            <p id="login-message"></p>
        </div>
    </div>

    <div id="device-warning" style="display: none;">
        <p id="warning-text">Nên dùng laptop để xem sẽ trọn vẹn hơn - do thiết kế chưa được tối ưu trên iphone,ipad</p>
    </div>

    <div id="start-overlay" style="display: none;">
        <p>Nhấp vào đây để bắt đầu...</p>
    </div>

    <div id="countdown-screen" style="display: none;">
        <div class="countdown-circle">
            <span id="countdown-number">5</span>
        </div>
    </div>

    <div id="intro-screen" style="display: none;">
        <div class="dialogue-box">
            <span id="dialogue-text"></span>
        </div>

        <div class="gwen-wrapper">
            <img src="gwen.png" id="gwen-char" class="white-aura-effect" alt="Gwen">
        </div>

        <div class="cup-wrapper" onclick="openGift()">
            <img src="cup.png.png" id="world-cup" class="white-aura-effect" alt="Cup CKTG">
            <p class="click-hint">Đồng ý !</p>
        </div>
    </div>

    <div id="white-overlay"></div>
    <div id="troll-container">
        <p class="troll-text">Muốn lấy à, đâu có dễ vậy ku 😒</p>
    </div>

    <div id="content-screen">
        <div class="video-container">
            <video id="gojo-video" playsinline webkit-playsinline preload="auto">
                <source src="gojo3.mp4" type="video/mp4">
            </video>
            <div id="video-subtitles"></div>
        </div>
    </div>

    <div id="explosion-screen" style="display: none;">
        <video id="notung-video" playsinline webkit-playsinline preload="auto">
            <source src="notung.mp4" type="video/mp4">
        </video>
    </div>

    <div id="final-screen" style="display: none;">
        <img src="kp.jpg" id="kp-img" alt="Ket Qua">
        
        <div id="right-sidebar">
            <p class="feedback-label">Còn gà nên không thực sự làm tốt lắm, nhưng feedback cho dzui</p>
            
            <div id="feedback-wrapper" style="opacity: 0;">
                <input type="text" id="user-feedback-input" placeholder="Nhập nhận xét vào đây nha..." autocomplete="off">
            </div>
        </div>
        
        <div id="message-container"></div>
        <div id="final-fade-overlay"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
